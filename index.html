<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forex Position Size Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            background-color: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        label, p {
            font-size: 14px;
        }
        input[type="number"] {
            width: 100%;
            padding: 8px;
            margin: 5px 0 20px;
            border-radius: 5px;
            border: 1px solid #ddd;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background-color: #218838;
        }
        .highlight {
            color: #d885a2;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Forex Position Size Calculator</h2>

        <label for="capital">Account Size (default $5000):</label>
        <input type="number" id="capital" value="5000">

        <label for="rpt">Risk Percentage (default 1%):</label>
        <input type="number" id="rpt" value="1" step="0.01">

        <label for="slPip">Stop Loss Pips:</label>
        <input type="number" id="slPip" placeholder="Enter stop loss in pips">

        <label for="targetPip">Target Pips:</label>
        <input type="number" id="targetPip" placeholder="Enter target in pips">

        <button onclick="calculatePosition()">Calculate Position Size</button>

        <p id="output"></p>
    </div>

    <script>
        function calculatePosition() {
            const account = parseFloat(document.getElementById('capital').value) || 5000;
            const rpt = parseFloat(document.getElementById('rpt').value) || 1;
            const slPip = parseFloat(document.getElementById('slPip').value);
            const targetPip = parseFloat(document.getElementById('targetPip').value);

            const lotNames = ["standard", "mini", "micro", "nano"];
            const lotSizes = { "standard": 1, "mini": 0.1, "micro": 0.01, "nano": 0.001 };
            const lotPerPip = { "standard": 10, "mini": 1, "micro": 0.1, "nano": 0.01 };

            let finalLotName = "";
            let finalLot = 0;
            let output = "";

            for (let i = 0; i < lotNames.length; i++) {
                const lotName = lotNames[i];
                const diff = lotPerPip[lotName] * slPip;

                if (diff <= (account * rpt / 100)) {
                    finalLotName = lotName;
                    const perPipValue = (account * rpt / 100) / diff;
                    finalLot = lotSizes[lotName] * perPipValue;
                    const finalLotPerPip = lotPerPip[lotName] * perPipValue;
                    const totalLoss = finalLotPerPip * slPip;
                    const totalProfit = finalLotPerPip * targetPip;

                    output += `<strong>Lot Name:</strong> ${finalLotName}<br>`;
                    output += `<strong>Lot Size:</strong> ${finalLot.toFixed(4)}<br>`;
                    output += `<strong>Lot Value Per Pip:</strong> ${finalLotPerPip.toFixed(4)}<br>`;
                    output += `<strong>Total Loss:</strong> $${totalLoss.toFixed(4)}<br>`;
                    output += `<strong>Total Profit:</strong> $${totalProfit.toFixed(4)}<br>`;
                    break;
                }
            }

            document.getElementById('output').innerHTML = output || "No suitable lot size found for given risk.";
        }
    </script>
</body>
</html>
